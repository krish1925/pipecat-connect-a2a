[project]
name = "pipecat-amazon-connect"
version = "0.1.0"
description = "Pipecat connector for Amazon Connect agent-to-agent (A2A) voice"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
keywords = ["pipecat", "amazon-connect", "a2a", "voice-agent", "contact-center", "telephony"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
authors = [{ name = "Krish Patel" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pipecat-ai[websocket]>=1.17.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://github.com/krish1925/pipecat-connect-a2a"
Issues = "https://github.com/krish1925/pipecat-connect-a2a/issues"

[project.optional-dependencies]
examples = [
    "pipecat-ai[cartesia,deepgram,openai,silero]>=1.17.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv.build-backend]
module-name = ["connect_a2a", "pipecat_connect_a2a"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
"tests/*" = ["E501", "E702", "B017"]
"src/connect_a2a/simulator.py" = ["E501"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
