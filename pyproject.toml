[project]
name = "pipecat-connect-a2a"
version = "0.1.0"
description = "Pipecat connector for Amazon Connect agent-to-agent (A2A) voice"
readme = "README.md"
authors = [
    { name = "Krish Patel", email = "knpatel@g.ucla.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pipecat-ai[websocket]>=1.17.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv.build-backend]
module-name = ["connect_a2a", "pipecat_connect_a2a"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
