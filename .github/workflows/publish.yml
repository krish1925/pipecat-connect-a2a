name: publish

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC): no API token secret needed.
# One-time setup on pypi.org -> your project -> Publishing: add a trusted publisher
#   owner=krish1925, repo=pipecat-connect-a2a, workflow=publish.yml, environment=pypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: make check
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
